
name: Build M Anak Pintar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create signing keystore
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "KEYSTORE_BASE64 kosong" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "KEYSTORE_PASSWORD kosong" && exit 1)
          test -n "$KEY_ALIAS" || (echo "KEY_ALIAS kosong" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "KEY_PASSWORD kosong" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          test -s app/keystore.jks || (echo "File keystore gagal dibuat" && exit 1)
          keytool -list -keystore app/keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Build APK
        run: gradle assembleDebug

      - name: Verify APK signature
        run: |
          apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Anak-Pintar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
